name: Checkpoint checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native rules and interface (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install SDL2 on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Install SDL2 on macOS
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: Configure a Debug build with assertions
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE="$(command -v python3)"
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Test native rules, protocol, and Python interface
        run: ctest --test-dir build-ci --output-on-failure

  browser-input:
    name: Browser input regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test taps, releases, holds, and pause behavior
        env:
          CATACOMB_WEB_URL: http://127.0.0.1:8787
        run: |
          python -m http.server 8787 --bind 127.0.0.1 --directory web > "$RUNNER_TEMP/catacomb-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          python -m unittest discover -s tests -p test_web_input.py -v

  player-contract:
    name: Player boundaries and evaluation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install the locked player environment
        run: |
          python -m pip install uv==0.11.26
          uv sync --frozen
      - name: Test contracts, memory, accounting and forced failures offline
        run: uv run --frozen python -m unittest discover -s tests -p 'test_players*.py' -v
