name: Midterm - weihao-zhou03
on:
  pull_request:
    paths:
      - 'midterms/weihao-zhou03/**'
      - '.github/workflows/midterm-weihao-zhou03.yml'
  push:
    branches: ['codex/echo-fishery']
    paths:
      - 'midterms/weihao-zhou03/**'
      - '.github/workflows/midterm-weihao-zhou03.yml'
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: midterms/weihao-zhou03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: midterms/weihao-zhou03/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
